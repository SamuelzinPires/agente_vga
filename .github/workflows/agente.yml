name: Agente de Vagas de Dados

on:
  schedule:
    # 10:37 e 20:37 UTC = 07:37 e 17:37 (BRT, UTC-3).
    #
    # Dois cuidados aqui, aprendidos medindo o atraso real:
    # 1. Minuto 37, nao minuto 0. Cron do Actions e best effort e entra numa fila
    #    compartilhada; o pico e na hora cheia, onde todo mundo agenda. Com
    #    '0 11,21' as rodadas sairam 2h a 4h atrasadas.
    # 2. ~20 min antes do horario desejado (08:00 / 18:00), para que a deriva
    #    residual da fila caia em cima da hora em vez de depois dela.
    - cron: '37 10,20 * * *'
  workflow_dispatch:

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar agente
        env:
          PERFIL_JSON: ${{ secrets.PERFIL_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: python main.py
